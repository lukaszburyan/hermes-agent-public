# Orchesta internal notifications (spec section 5: Telegram is an internal
# alarm channel for the Orchesta account only, never customer-facing).
#
# IMPORTANT: the reply-writer module does NOT receive this file. Only the
# internal notification dispatcher reads it.

internal_notifications:
  email:
    enabled: true
    recipient: identity-004@gmail.com

  human_review:
    telegram:
      enabled: true
      destination_env: HERMES_TELEGRAM_CHAT_ID

  runtime_error:
    telegram:
      enabled: true
      destination_env: HERMES_TELEGRAM_CHAT_ID

  llm_error:
    telegram:
      enabled: true
      destination_env: HERMES_TELEGRAM_CHAT_ID
