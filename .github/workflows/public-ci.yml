name: Public safety CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: public-safety-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan with full history
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install checksum-pinned Gitleaks CLI
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            --output /tmp/gitleaks.tar.gz
          printf '%s  %s\n' \
            '9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c' \
            '/tmp/gitleaks.tar.gz' | sha256sum --check -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Scan every reachable ref
        run: /tmp/gitleaks detect --source . --redact --no-banner --log-opts=--all --exit-code=1

  tests:
    name: Public snapshot test suite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install locked test environment
        run: python -m pip install --require-hashes -r requirements-ci.lock
      - name: Run the public suite once
        run: >-
          python -m pytest -q
          --ignore=tests/test_canonical_entrypoints.py
          --ignore=tests/test_free_github_governance.py
